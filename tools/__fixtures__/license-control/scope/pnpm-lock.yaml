lockfileVersion: '9.0'

# 控制用例 D：批准前提失效（期望退出码 2 —— 已 approved 但不再适用，必须重新裁定）。
#
# config/license-policy.json 里 minimatch@10.2.6（BlueOak-1.0.0）的裁定条目是
# status=approved + distributed:false —— 放行它的**唯一理由**是「仅构建期使用、
# 不随作品或镜像分发」。这份夹具把同一个包放进 dependencies（生产依赖），
# 于是那个理由当场不成立：
#   - 批准不得再被沿用 → verdict 退回 review-required（不是 allowed）
#   - 与「未登记」同档 → 退出码 2，并在 stdout / 清单文件 / step summary 里点名
#
# 对照的一半在 control.mjs 里：把同一条裁定的 distributed 改成 true（其余字节不动）
# 再跑一次同一份夹具，退出码必须回到 0。这一红一绿合起来才证明规则是按
# distributed 这个前提判的，而不是「凡是生产依赖里的 reviewRequired 一律判红」
# —— 后者同样会让本夹具变红，却抓不住真正的失效场景。
#
# zod（MIT）作为对照，证明判红是逐条的，不是一见失效批准就把整份报告判死。
#
# 使用的是仓库线上那份真策略（control.mjs 以相对路径传入），不是夹具自带的副本。

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      minimatch:
        specifier: 10.2.6
        version: 10.2.6
      zod:
        specifier: 4.6.7
        version: 4.6.7

packages:

  minimatch@10.2.6:
    resolution: {integrity: sha512-LQ159FIXTURENOTAREALINTEGRITY00000000000000000000000000000000000000000000000000000000020}
    engines: {node: '>=18'}

  zod@4.6.7:
    resolution: {integrity: sha512-LQ159FIXTURENOTAREALINTEGRITY00000000000000000000000000000000000000000000000000000000021}

snapshots:

  minimatch@10.2.6: {}

  zod@4.6.7: {}
