# 质量基座流水线（ZLQ-159 / ZLQ-153 §14 Stage 1-1）。
#
# 顺序按 issue 第 3 条：install → typecheck → lint → 依赖图门禁 → build → test。
# 许可证与 SBOM 门禁是独立的 license-check 工作流（它已在默认分支注册为必需检查，
# 保留原工作流名以免破坏分支保护规则的状态上下文名）。
#
# 这份顺序**不再只是注释里的约定**：tools/test/ci-workflow.test.mjs 会把每个作业里实际执行的
# pnpm 脚本按出现顺序抽出来，断言它们是 `pnpm verify` 链路的严格递增子序列。任何一侧单独调序
# 都会让 `pnpm test` 变红——ZLQ-160 之前，本地 verify 把 build 放在第一位而 CI 把 typecheck
# 放在第一位，两边都"绿着"，直到首次推送才在干净检出上暴露 9 处 TS2307。
#
# typecheck 自身在干净检出下是自足的：`pnpm typecheck` = `tsc -b tsconfig.json`（solution
# 构建，产出 packages/*/dist/index.d.ts）+ 两份 noEmit 配置的类型检查。packages/*/package.json
# 的 types 指向 ./dist/index.d.ts，所以类型检查依赖那次构建；把它并进 typecheck 而不是靠
# CI 步骤排序来保证，本地与 CI 就不会再各说各话。后面的「构建」步骤因此是增量空操作。
#
# 三条不放宽的约束：
#   1. `--frozen-lockfile`：CI 永不重新解析依赖。锁文件与 package.json 不一致就失败，
#      而不是悄悄生成一份新锁文件——那会让「本地绿、CI 绿」指向两个不同的依赖树。
#   2. 依赖图门禁必须连**对照用例**一起跑（dep-graph:control）。只跑 dep-graph 得到
#      「0 违规」证明不了门禁有效：一个永远返回 0 的检查在 CI 里同样是绿的。
#   3. permissions 收敛到 contents: read。这条流水线不需要写权限。
#
# 刻意**不做**的事：不校验 install 之后工作树是否干净。pnpm 12 会在每次 install 时
# 自动维护 pnpm-workspace.yaml 的 minimumReleaseAgeExclude（按当前日期滚动），
# 加一道 `git diff --exit-code` 只会得到一个随时间变红的假门禁。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      # 手动触发时没有事件负载可以推导 base，所以基线必须由触发者显式给出。
      # `required: true` 是刻意的：留空会让下面的解析步骤拿不到 SHA，而"拿不到 base"
      # 必须以 exit 2 / CONTRACT_BASE_UNAVAILABLE 失败，绝不能退化成 head 跟自己比。
      contract_base_sha:
        description: '契约兼容性比较的 base commit SHA（40 位，非全零，不同于 head）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 构建 / 类型 / lint / 依赖图 / 测试
    runs-on: ubuntu-latest

    # 真 PostgreSQL 服务容器（ZLQ-225）。
    #
    # 为什么必须有它：`pnpm test` 里有 5 个测试文件走 packages/infra/test/support-database.ts
    # 这个真库挂具，而挂具在探测不到可用 Postgres 时**抛**（调用方在模块顶层 await），于是整份
    # 文件收集失败、里面的用例一律记成 failed。那是 ZLQ-194 §9.2 规则 5 的直接后果：
    # readiness-no-retirement-tokens 门禁把 skipIf / skip / todo 一并禁掉，理由是「被跳过的用例
    # 不会变红，只会消失」。所以「CI 上没有库」这件事不会被静默跳过掩盖住，它会把整个测试作业
    # 染红 —— 而这条红不是被测代码的缺陷，是流水线少了一台库。
    #
    # 因此让它变绿的唯一正确方式是给 CI 一台真库。以下三种都不许用：加回 skipIf、换进程内或
    # 内存替身、把这些文件从 CI 里摘掉。
    #
    # `postgres:17` 与本地实测版本（PostgreSQL 17.11）同主版本，不要换成别的主版本。
    # `POSTGRES_HOST_AUTH_METHOD: trust` 只在这个随作业销毁、且只映射到 runner 自身
    # 127.0.0.1 的一次性容器里成立，**不得**被抄进任何应用配置、迁移 SQL 或文档。
    # `pg_isready` 那段健康检查是让作业等库真的能接受连接再跑第一步；删掉它会得到一条随
    # runner 快慢而偶发变红的门禁。
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    # 真库挂具的连接串。用户 `postgres` 是镜像默认的超级用户，不是 runner 的登录用户；库
    # `postgres` 是镜像默认建出的那个库 —— 挂具只在它上面 CREATE DATABASE 一个随机名的一次性
    # 库、跑完 DROP … WITH (FORCE)，默认库本身不承载任何业务数据。这里不含任何凭据。
    #
    # 放在作业级而不是「测试」那一步的 step 级：当前只有 `pnpm test` 需要它，但作业级能让将来
    # 在这个作业里新增的、同样需要真库的门禁自动继承，不必再改一次工作流；而对不需要库的步骤
    # 它只是一个没人读的环境变量，不改变任何判定。
    #
    # e2e-smoke 作业**不加**这套：它跑的 `pnpm test:e2e:smoke` 是 playwright，两个 webServer 都
    # 是 tools/static-server.mjs 起的纯静态文件服务（apps/web/out 与 artifacts），不连库。
    env:
      LQ_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      # pnpm 必须在 setup-node 之前：后者的 `cache: pnpm` 需要调用 `pnpm store path`。
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖（锁文件冻结）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint（含由 config/dependency-graph.json 生成的边界规则）
        run: pnpm lint

      # 格式配置只有被强制才算存在：否则下一个 PR 会把重排和功能改动混在一份 diff 里。
      # .prettierignore 已排除治理文件（LICENSE/NOTICE/README/CONTRIBUTING）、生成物
      # 与测试夹具，所以这一步不会去动本任务无权重写的文件。
      - name: 格式检查
        run: pnpm format:check

      - name: 依赖图门禁
        run: pnpm dep-graph

      - name: 依赖图门禁对照用例（故意植入的 8 处违规必须全部命中）
        run: pnpm dep-graph:control

      # typecheck 已经跑过 `tsc -b`，所以这一步的类型部分是增量空操作；但 `build` 不只是
      # `tsc -b` —— 它还会执行 `web:build`，把 apps/web 真正导出成静态站点并检查产物
      # （ZLQ-190 §6.1：build 不得仅凭旧的 dist/index.js 通过）。保留它有两个理由：产物要
      # 落在工作树里供后续步骤与本地复现使用，而且 `build` 是 verify 链路上的一道独立门禁，
      # 从 CI 里删掉它等于让「构建能过」这件事不再被强制。
      - name: 构建
        run: pnpm build

      # 契约快照一致性：从**已构建**的 @littleq/api-contract 重新生成，与仓库里提交的
      # 快照逐字节比较（附录 A §4.2 A）。放在 build 之后是硬性顺序——生成入口读的是
      # dist，不是 src。这一步只读，绝不回写快照。
      - name: 契约快照一致性（生成结果与已提交快照逐字节相同）
        run: pnpm contract:check

      # 基线解析（附录 B G1）：不改 checkout 的 depth=1、不全量拉历史、不走 REST API，
      # 也绝不因 push event 跳过比较。三种事件各有一个**事件定义的前态**：
      #   push              → github.event.before
      #   pull_request      → github.event.pull_request.base.sha
      #   workflow_dispatch → 必填的 contract_base_sha 输入
      # 事件负载一律通过 step 级 env 传入，不在 run 块里插值（仓库既有约束：任何 run 块
      # 内插 github.event 都等于把不可信文本拼进 shell）。
      - name: 解析契约比较基线 CONTRACT_BASE_SHA
        id: contract_base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISPATCH_BASE_SHA: ${{ github.event.inputs.contract_base_sha }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::CONTRACT_BASE_UNAVAILABLE — $1"
            exit 2
          }

          case "$EVENT_NAME" in
            push) sha="$PUSH_BEFORE" ;;
            pull_request) sha="$PR_BASE_SHA" ;;
            workflow_dispatch) sha="$DISPATCH_BASE_SHA" ;;
            *) fail "未建模的触发事件 '$EVENT_NAME'，无法确定契约比较基线" ;;
          esac

          # 40 位十六进制、非全零、不同于 head。全零是 GitHub 对「新建分支/新建仓库」
          # 的占位值，不是一个 commit；回退到 HEAD^ 或工作树都在附录 B 明令禁止之列。
          zero_sha='0000000000000000000000000000000000000000'
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' \
            || fail "基线 SHA '$sha' 不是 40 位十六进制 commit SHA"
          [ "$sha" != "$zero_sha" ] \
            || fail '基线 SHA 全零：本次事件没有可用的前态'
          head_sha="$(git rev-parse HEAD)"
          [ "$sha" != "$head_sha" ] \
            || fail "基线 SHA 与 head ($head_sha) 相同，比较会退化成自身对拍"

          # 浅克隆里这个 commit 默认不存在。只补这一个 commit（depth=1），不拉全量历史。
          git fetch --no-tags --depth=1 origin "$sha" \
            || fail "无法从 origin 取到基线 commit $sha"
          [ "$(git rev-parse FETCH_HEAD)" = "$sha" ] \
            || fail "FETCH_HEAD 与请求的基线 SHA 不一致"
          git cat-file -e "$sha^{commit}" \
            || fail "基线 commit $sha 在本地不可读"

          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # 兼容性：比较事件定义的前态与本次 head 的聚合变化，不要求本地存在 merge-base。
      # 基线不可得时比较器自己以 exit 2 / CONTRACT_BASE_UNAVAILABLE 失败，不退化。
      - name: 契约兼容性（相对 base 无破坏性变更；base 不可得即 exit 2）
        env:
          CONTRACT_BASE_SHA: ${{ steps.contract_base.outputs.sha }}
        run: pnpm contract:compat

      # 对照用例：证明上面两道门禁真的会红。全部 fixture 提交在仓库里，不读 host git /
      # host node_modules / 平台状态，所以它在任何 runner 上跑的是同一组断言。
      - name: 契约门禁对照用例（破坏性变更必须被抓到、非破坏性必须放行）
        run: pnpm contract:control

      # 产物落在 artifacts/（已 gitignore）。这里生成它是为了把 web.js 交给
      # 下面的 e2e-smoke 作业复用同一份构建配置；单元/工具测试自己会按需重建，
      # 不依赖这一步的执行顺序。
      - name: 打包（保留 /*! @license */ 法务注释，§10.3）
        run: pnpm bundles

      - name: 测试
        run: pnpm test

  e2e-smoke:
    name: e2e smoke（真实浏览器加载构建产物）
    runs-on: ubuntu-latest
    # 依赖 quality 而不是并行跑：产物要先构建出来，而且没必要在类型都对不上的
    # 提交上花两分钟下载浏览器。
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖（锁文件冻结）
        run: pnpm install --frozen-lockfile

      # 浏览器二进制按锁文件做键缓存：命中时 install 是空操作，未命中时下载约 100 MiB。
      # 把它与 quality 分成两个作业，正是为了让 CDN 抖动不至于把整条质量信号染红。
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps chromium

      # 先构建静态站点：e2e 现在加载的是 apps/web/out 这份**真实部署产物**（ZLQ-190 §6.2），
      # 不再只是 esbuild 的合规 bundle。`pnpm build` 内部已经会跑一次 `pnpm bundles`，
      # 下面那步是刻意保留的重复：它让「e2e 加载的产物在本作业内被构建过」这条契约
      # 独立于 `web:build` 的内部编排，将来谁改了 web:build 也不会让 e2e 悄悄加载旧产物。
      - name: 构建静态站点（e2e 加载的就是这份产物）
        run: pnpm build

      - name: 打包（e2e 加载的就是这份产物）
        run: pnpm bundles

      - name: e2e smoke
        run: pnpm test:e2e:smoke

      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
