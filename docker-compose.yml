services:
  app:
    build: .
    ports:
      - "${HOST_PORT:-80}:80"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "80"
      HOSTNAME: "0.0.0.0"
      PGLITE_DIR: /app/.data/pglite
    volumes:
      - littleq-data:/app/.data
    restart: unless-stopped

volumes:
  littleq-data:
